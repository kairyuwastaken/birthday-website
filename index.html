<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You've Got a Message</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#c11f1f;
    --red-deep:#7a1010;
    --ink:#14100f;
    --cream:#fdfbf5;
    --navy:#060a14;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:#05070c;
    font-family:'Kalam',cursive;
  }
  body{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }

  /* bullet-proof responsive ratio box: never collapses, never scrolls off */
  .stage-outer{
    position:relative;
    width:100%;
    max-width:1200px;
  }
  .stage-outer::before{
    content:"";
    display:block;
    padding-top:56.25%; /* 16:9 */
  }
  .stage{
    position:absolute; inset:0;
    background:#0b1220;
    border:10px solid var(--red);
    border-radius:14px;
    box-shadow: inset 0 0 0 4px var(--ink), 0 25px 60px rgba(0,0,0,0.65);
    overflow:hidden;
  }

  .city{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    object-position: center 30%;
    display:block;
    filter: saturate(1.05);
  }
  .scrim{
    position:absolute; inset:0;
    background: radial-gradient(120% 100% at 75% 85%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.45) 100%);
    pointer-events:none;
  }

  /* ---------------- BUBBLE (pure CSS, no image) ---------------- */
  .bubble-box{
    position:absolute;
    left:4%; top:6%;
    width:62%;
    z-index:4;
    opacity:0; transform: scale(.7);
    transform-origin: 82% 100%;
    transition: opacity .3s cubic-bezier(.2,1.5,.4,1), transform .35s cubic-bezier(.2,1.5,.4,1);
    pointer-events:none;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,0.4));
  }
  .bubble-box.show{ opacity:1; transform:scale(1); pointer-events:auto; }
  .bubble{
    position:relative;
    background: var(--cream);
    border: 5px solid var(--ink);
    border-radius: 34px;
    padding: 4.5% 5.5%;
    box-shadow: 0 9px 0 rgba(0,0,0,0.15);
  }
  .bubble::after{
    /* The tail is anchored with bottom:0 + translateY(50%) rather than a
       negative percentage bottom, because a percentage "bottom" on an
       absolutely-positioned element resolves against the CONTAINING
       BLOCK's height -- and .bubble's height is auto (sized by its own
       content), which browsers treat as indefinite, silently dropping
       the offset. translateY(%) instead resolves against the tail's
       OWN height (fixed by aspect-ratio + width), which is always
       definite, so this always renders correctly. */
    content:"";
    position:absolute;
    left: 76%;
    bottom: 0;
    width: 10%;
    aspect-ratio: 1/1;
    background: var(--cream);
    border-right: 5px solid var(--ink);
    border-bottom: 5px solid var(--ink);
    border-radius: 0 0 6px 0;
    transform: translateY(55%) rotate(45deg);
  }
  .bubble h1{
    margin:0 0 2% 0; font-family:'Bangers',cursive; color:var(--red);
    -webkit-text-stroke:0.5px var(--ink);
    letter-spacing:0.5px;
    line-height:1.05;
  }
  .bubble p{
    margin:0; font-family:'Kalam',cursive; font-weight:700; color:var(--ink);
    line-height:1.3;
  }
  .bubble-actions{ display:flex; gap:3%; margin-top:4%; align-items:center; }
  .btn{
    font-family:'Bangers',cursive; letter-spacing:1px;
    padding: 2.5% 6%;
    border-radius:999px; border:2.5px solid var(--ink);
    cursor:pointer;
    background:var(--red); color:var(--cream);
    box-shadow: 0 3px 0 var(--red-deep);
  }
  .btn.ghost{ background:var(--cream); color:var(--ink); box-shadow:0 3px 0 #999; }
  .btn:active{ transform:translateY(2px); box-shadow:none; }

  /* ---------------- EXCLAMATION ---------------- */
  .bang-box{
    position:absolute;
    right: 21%; top: 2%;
    width: 8%;
    z-index:5;
    cursor:pointer;
    animation: bangPulse 1.1s ease-in-out infinite;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,0.5));
    transition: opacity .25s ease, transform .25s ease;
  }
  .bang-box img{ width:100%; display:block; }
  .bang-box.hide{ opacity:0; transform:scale(.4); pointer-events:none; }
  @keyframes bangPulse{
    0%,100%{ transform: translateY(0) scale(1) rotate(-3deg); }
    50%{ transform: translateY(-8%) scale(1.08) rotate(-1deg); }
  }

  /* ---------------- PHONE ---------------- */
  /* .phone-box only carries position/size; .phone-frame gets a REAL,
     definite pixel height via the padding-top trick. Without this,
     some browsers treat an auto-height absolutely-positioned box as
     having an indefinite height, and silently ignore percentage
     top/height on the screen-overlay child -- which is what was
     causing the screen to render offset. */
  .phone-box{
    position:absolute;
    right: -3%; bottom: -6%;
    width: 33%;
    z-index:3;
    cursor:pointer;
    filter: drop-shadow(0 14px 20px rgba(0,0,0,0.55));
    animation: phoneBob 3.6s ease-in-out infinite;
  }
  @keyframes phoneBob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-1.4%); }
  }
  .phone-frame{
    position:relative;
    width:100%;
  }
  .phone-frame::before{
    content:"";
    display:block;
    width:100%;
    padding-top: 141.68%; /* 673 / 475 (natural phone art ratio) */
  }
  .phone-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
  }

  @media (max-width:640px){
    .bubble{ gap:1%; }
    .bubble-actions{ margin-top:3%; }
  }
</style>
</head>

<script>
(function(){
  const stage = document.getElementById('stage');
  const bubbleBox = document.getElementById('bubbleBox');
  const bTitle = document.getElementById('bTitle');
  const bText = document.getElementById('bText');
  const bActions = document.getElementById('bActions');
  const bangBox = document.getElementById('bangBox');
  const phoneBox = document.getElementById('phoneBox');

  let state = 'idle';

  function setBubble(title, text, actionsHTML){
    bTitle.textContent = title;
    bText.textContent = text;
    if(actionsHTML){ bActions.innerHTML = actionsHTML; bActions.style.display='flex'; }
    else { bActions.innerHTML=''; bActions.style.display='none'; }
    bind();
  }

  function bind(){
    const rec = document.getElementById('btnReceive');
    const dec = document.getElementById('btnDecline');
    const back = document.getElementById('btnClose');
    const undo = document.getElementById('btnUndo');
    if(rec) rec.onclick = e=>{ e.stopPropagation(); goReceived(); };
    if(dec) dec.onclick = e=>{ e.stopPropagation(); goDeclined(); };
    if(back) back.onclick = e=>{ e.stopPropagation(); goIdle(); };
    if(undo) undo.onclick = e=>{ e.stopPropagation(); goRevealed(); };
  }

  function goIdle(){
    state='idle';
    bangBox.classList.remove('hide');
    bubbleBox.classList.remove('show');
  }

  function goNotified(){
    state='notified';
    bangBox.classList.add('hide');
    setBubble('SOMEONE SENT YOU A MESSAGE!', 'Click the phone to continue.');
    bubbleBox.classList.add('show');
  }

  function goRevealed(){
    state='revealed';
    setBubble(
      "OH, IT'S FROM KIRTAN...",
      'Would you like to receive the message, or decline it?',
      '<button class="btn" id="btnReceive">Receive</button><button class="btn ghost" id="btnDecline">Decline</button>'
    );
    bubbleBox.classList.add('show');
  }

  function goReceived(){
    state='received';
    setBubble('OPENING MESSAGE...', "Hang tight!", '');
    // brief comic-book beat before handing off to the actual gift page
    setTimeout(()=>{ window.location.href = 'giftpage.html'; }, 500);
  }

  function goDeclined(){
    state='declined';
    setTimeout(()=>{ window.location.href = 'tulip.html'; }, 500);
  }

  function handleTap(){
    if(state==='idle') goNotified();
    else if(state==='notified') goRevealed();
  }

  phoneBox.addEventListener('click', handleTap);
  bangBox.addEventListener('click', handleTap);

  // Proportional text sizing driven by real measured pixel width --
  // avoids vw units, which behave inconsistently across preview
  // frames and embedded webviews. This just always matches reality.
  function relayout(){
    const bw = bubbleBox.getBoundingClientRect().width;
    if(bw > 0){
      bTitle.style.fontSize = Math.max(13, bw*0.052) + 'px';
      bText.style.fontSize  = Math.max(9,  bw*0.024) + 'px';
      bActions.querySelectorAll('.btn').forEach(b=>{
        b.style.fontSize = Math.max(11, bw*0.030) + 'px';
      });
    }
  }

  window.addEventListener('resize', relayout);
  if(window.ResizeObserver){
    new ResizeObserver(relayout).observe(stage);
  }
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(relayout);
  }
  window.addEventListener('load', relayout);

  goIdle();
  relayout();
})();
</script>
